name: Move Telegram Bot Files to Root

on:
  workflow_dispatch: # امکان اجرای دستی از طریق تب Actions در گیت‌هاب
  push:
    branches:
      - main # یا نام شاخه پیش‌فرض خود (مثلاً master)

jobs:
  move-files:
    runs-on: ubuntu-latest
    permissions:
      contents: write # دسترسی برای نوشتن و کامیت کردن تغییرات روی ریپازیتوری
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Move files and remove folder
        run: |
          # انتقال تمام محتویات (شامل فایل‌های مخفی مثل .env یا .gitignore اگر داخلش باشند) به پوشه اصلی
          shopt -s dotglob
          mv telegram-bot/* ./
          
          # حذف پوشه خالی telegram-bot
          rmdir telegram-bot

          # اضافه کردن تغییرات به گیت
          git add -A

          # بررسی اینکه آیا تغییری برای کامیت کردن وجود دارد یا خیر
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Move telegram-bot files to root and delete empty directory"
            git push
          fi
