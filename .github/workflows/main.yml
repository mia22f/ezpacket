name: Move Telegram Bot Files to Root

on:
  workflow_dispatch:

jobs:
  move-files:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Move files and remove folder
        run: |
          # فعال‌سازی نمایش فایل‌های مخفی
          shopt -s dotglob
          
          # انتقال فایل‌ها به پوشه روت
          mv telegram-bot/* .
          
          # حذف کامل پوشه خالی
          rm -rf telegram-bot

          # اضافه کردن تغییرات به گیت و کامیت
          git add -A

          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Move telegram-bot files to root and delete empty directory"
            git push
          fi
