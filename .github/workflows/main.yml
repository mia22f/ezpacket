
name: Move Telegram Bot to Root

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  move-files:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout default branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Inspect repository and locate folder
        id: locate
        shell: bash
        run: |
          set -euo pipefail

          echo "Default branch: ${{ github.event.repository.default_branch }}"
          echo "Repository root:"
          ls -la

          SOURCE="telegram-bot"

          if [ ! -d "$SOURCE" ]; then
            echo "::error::telegram-bot not found in the default branch."
            echo "Tracked paths matching telegram-bot:"
            git ls-files | grep -i 'telegram-bot' || true
            exit 1
          fi

          echo "source=$SOURCE" >> "$GITHUB_OUTPUT"

      - name: Move folder contents to root
        shell: bash
        env:
          SOURCE: ${{ steps.locate.outputs.source }}
        run: |
          set -euo pipefail

          # Prevent overwriting any existing root-level item.
          while IFS= read -r -d '' item; do
            name="${item#"$SOURCE"/}"

            if [[ -e "./$name" || -L "./$name" ]]; then
              echo "::error::Root item already exists: $name"
              exit 1
            fi
          done < <(
            find "$SOURCE" -mindepth 1 -maxdepth 1 -print0
          )

          # Include hidden files and directories.
          find "$SOURCE" -mindepth 1 -maxdepth 1 \
            -exec mv -t . -- {} +

          rmdir "$SOURCE"

      - name: Commit and push
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Move telegram-bot contents to repository root"
          git push origin "HEAD:${TARGET_BRANCH}"
